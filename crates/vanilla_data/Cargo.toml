[package]
name = "bedrock_vanilla_data"
version = "0.1.0"
edition = "2024"

[features]
deny-unknown-fields = []
default = ["deny-unknown-fields"]

[dependencies]
bedrock_level = { path = "../level" }
nbtx = { workspace = true }
# `#[derive(Facet)]` expands to `::facet::`-rooted paths, so a crate that
# derives it needs facet directly, at the rev nbtx pins.
facet = { workspace = true }
# Compound keys are raw bytes (`bstr::BString`).
bstr = { workspace = true }

[dev-dependencies]
tar = { workspace = true }
flate2 = { workspace = true }
tempfile = { workspace = true }
