[package]
name = "bedrock_addon_shared_shapes"
description = "The small value shapes several bedrock_addon content families share (descriptors, menu categories, colours, one-or-many lists, vectors, the event tree, the PNG header), re-exported as bedrock_addon::shared; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
facet = { workspace = true }
facet-value = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
facet-json = { workspace = true }
