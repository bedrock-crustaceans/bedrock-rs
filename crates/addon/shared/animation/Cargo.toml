[package]
name = "bedrock_addon_shared_animation"
description = "What the animation and animation_controller content families of bedrock_addon share: the schema walk both loaders run, the particle, sound and event values, and the reading, Molang check, validation, writing and registry combine of both file kinds; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The load-time Molang compile check of both file kinds.
molang = ["bedrock_addon_core/molang"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
facet-json = { workspace = true }
facet-value = { workspace = true }
indexmap = { workspace = true }
