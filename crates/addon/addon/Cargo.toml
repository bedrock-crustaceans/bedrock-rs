[dev-dependencies]
# The cost tests (`test_cost`), in the unit tests and the test binaries.
bedrock_addon_core = { path = "../core", features = ["test-cost"] }
# The tests build archives, zips and encrypted packs by hand.
brarchive = { workspace = true }
zip = { workspace = true }
aes = { workspace = true }
# The skeleton bench (`benches/skeleton.rs`).
criterion = { workspace = true }

[[example]]
name = "in_memory_pack"
required-features = ["block"]

[[example]]
name = "entity_components"
required-features = ["entity"]

[[example]]
name = "client_visuals"
