[package]
name = "bedrock_addon"
description = "Minecraft Bedrock Edition behaviour and resource packs as typed Rust data: manifests, containers, pack stacks, every content family, diagnostics and write-back; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
# Shows which feature each item needs.
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["zip", "encrypted", "molang", "nbt", "full"]
# infrastructure
zip = ["bedrock_addon_storage/zip"]      # in-memory decoding and encoding of .mcpack/.zip/.mcaddon/.mctemplate
encrypted = ["zip", "bedrock_addon_storage/encrypted"]   # marketplace content keys
# `molang` is the load-time Molang compile check, `nbt` gives Block::to_network_nbt,
# Item::network_properties, …; both are generated below, with a forward to every family crate
# that has the feature.
# optional checks, off by default (not in `default`, not in `full`)
script-syntax = ["script", "bedrock_addon_family_script?/script-syntax"]   # full JS syntax check of script files

# families: one feature per game document family, the module `families::<name>`.
# A family's line is written here by hand when it pulls in more than the family's crate; every
# other family line, `full` and the forwards of `molang` and `nbt` are generated from the crates
# under `families/` by `cargo xtask addon-features`.
# behaviour pack
biome = ["dep:bedrock_addon_family_biome", "dep:bedrock_addon_shared_biome_env"]
feature = ["dep:bedrock_addon_family_feature", "dep:bedrock_addon_shared_scatter"]
feature_rules = ["dep:bedrock_addon_family_feature_rules", "dep:bedrock_addon_shared_scatter"]
server_config = ["dep:bedrock_addon_family_server_config", "script"]  # a dedicated server's script configuration, held against the script modules
spawn_groups = ["dep:bedrock_addon_family_spawn_groups", "dep:bedrock_addon_shared_spawn"]
spawn_rules = ["dep:bedrock_addon_family_spawn_rules", "dep:bedrock_addon_shared_spawn"]
structure = ["dep:bedrock_addon_family_structure", "dep:nbtx"]  # structure palettes are NBT compounds (pack/link/world/structure_block.rs)
# resource pack
animation = ["dep:bedrock_addon_family_animation", "dep:bedrock_addon_shared_animation"]
animation_controller = ["dep:bedrock_addon_family_animation_controller", "dep:bedrock_addon_shared_animation"]
client_biome = ["dep:bedrock_addon_family_client_biome", "dep:bedrock_addon_shared_biome_env"]
languages = ["dep:bedrock_addon_family_lang"]  # a second feature over the lang crate, the module `families::languages`
# begin generated by `cargo xtask addon-features`: the family features
molang = [
    "bedrock_addon_core/molang",
    "bedrock_addon_shared_visual/molang",
    "bedrock_addon_family_animation?/molang",
    "bedrock_addon_family_animation_controller?/molang",
    "bedrock_addon_family_attachable?/molang",
    "bedrock_addon_family_biome?/molang",
    "bedrock_addon_family_block?/molang",
    "bedrock_addon_family_client_entity?/molang",
    "bedrock_addon_family_entity?/molang",
    "bedrock_addon_family_feature?/molang",
    "bedrock_addon_family_feature_rules?/molang",
    "bedrock_addon_family_geometry?/molang",
    "bedrock_addon_family_item?/molang",
    "bedrock_addon_family_particle?/molang",
    "bedrock_addon_family_recipe?/molang",
    "bedrock_addon_family_render_controller?/molang",
    "bedrock_addon_family_sounds_json?/molang",
    "bedrock_addon_family_spawn_groups?/molang",
    "bedrock_addon_family_spawn_rules?/molang",
]
nbt = [
    "dep:nbtx",
    "bedrock_addon_family_block?/nbt",
    "bedrock_addon_family_entity?/nbt",
    "bedrock_addon_family_item?/nbt",
]
aim_assist = ["dep:bedrock_addon_family_aim_assist"]
atomic_client_entity = ["dep:bedrock_addon_family_atomic_client_entity"]
attachable = ["dep:bedrock_addon_family_attachable"]
behavior_tree = ["dep:bedrock_addon_family_behavior_tree"]
biomes_client = ["dep:bedrock_addon_family_biomes_client"]
block = ["dep:bedrock_addon_family_block"]
block_culling = ["dep:bedrock_addon_family_block_culling"]
blocks_json = ["dep:bedrock_addon_family_blocks_json"]
camera = ["dep:bedrock_addon_family_camera"]
client_entity = ["dep:bedrock_addon_family_client_entity"]
crafting_catalog = ["dep:bedrock_addon_family_crafting_catalog"]
credits = ["dep:bedrock_addon_family_credits"]
ddui = ["dep:bedrock_addon_family_ddui"]
deferred_settings = ["dep:bedrock_addon_family_deferred_settings"]
dialogue = ["dep:bedrock_addon_family_dialogue"]
dimension = ["dep:bedrock_addon_family_dimension"]
entity = ["dep:bedrock_addon_family_entity"]
flipbooks = ["dep:bedrock_addon_family_flipbooks"]
fog = ["dep:bedrock_addon_family_fog"]
font = ["dep:bedrock_addon_family_font"]
function = ["dep:bedrock_addon_family_function"]
geometry = ["dep:bedrock_addon_family_geometry"]
item = ["dep:bedrock_addon_family_item"]
jigsaw = ["dep:bedrock_addon_family_jigsaw"]
json_ui = ["dep:bedrock_addon_family_json_ui"]
lang = ["dep:bedrock_addon_family_lang"]
legacy_path_mapping = ["dep:bedrock_addon_family_legacy_path_mapping"]
loading_messages = ["dep:bedrock_addon_family_loading_messages"]
loot = ["dep:bedrock_addon_family_loot"]
material = ["dep:bedrock_addon_family_material"]
music = ["dep:bedrock_addon_family_music"]
particle = ["dep:bedrock_addon_family_particle"]
persona = ["dep:bedrock_addon_family_persona"]
poi = ["dep:bedrock_addon_family_poi"]
recipe = ["dep:bedrock_addon_family_recipe"]
render_controller = ["dep:bedrock_addon_family_render_controller"]
script = ["dep:bedrock_addon_family_script"]
server_sound_definitions = ["dep:bedrock_addon_family_server_sound_definitions"]
skin = ["dep:bedrock_addon_family_skin"]
sound_definitions = ["dep:bedrock_addon_family_sound_definitions"]
sound_file = ["dep:bedrock_addon_family_sound_file"]
sounds_json = ["dep:bedrock_addon_family_sounds_json"]
splashes = ["dep:bedrock_addon_family_splashes"]
texture_atlas = ["dep:bedrock_addon_family_texture_atlas"]
texture_file = ["dep:bedrock_addon_family_texture_file"]
texture_list = ["dep:bedrock_addon_family_texture_list"]
texture_set = ["dep:bedrock_addon_family_texture_set"]
trade = ["dep:bedrock_addon_family_trade"]
ui_texture_info = ["dep:bedrock_addon_family_ui_texture_info"]
voxel_shape = ["dep:bedrock_addon_family_voxel_shape"]
full = [
    "aim_assist",
    "animation",
    "animation_controller",
    "atomic_client_entity",
    "attachable",
    "behavior_tree",
    "biome",
    "biomes_client",
    "block",
    "block_culling",
    "blocks_json",
    "camera",
    "client_biome",
    "client_entity",
    "crafting_catalog",
    "credits",
    "ddui",
    "deferred_settings",
    "dialogue",
    "dimension",
    "entity",
    "feature",
    "feature_rules",
    "flipbooks",
    "fog",
    "font",
    "function",
    "geometry",
    "item",
    "jigsaw",
    "json_ui",
    "lang",
    "languages",
    "legacy_path_mapping",
    "loading_messages",
    "loot",
    "material",
    "music",
    "particle",
    "persona",
    "poi",
    "recipe",
    "render_controller",
    "script",
    "server_config",
    "server_sound_definitions",
    "skin",
    "sound_definitions",
    "sound_file",
    "sounds_json",
    "spawn_groups",
    "spawn_rules",
    "splashes",
    "structure",
    "texture_atlas",
    "texture_file",
    "texture_list",
    "texture_set",
    "trade",
    "ui_texture_info",
    "voxel_shape",
]
# end generated: the family features

