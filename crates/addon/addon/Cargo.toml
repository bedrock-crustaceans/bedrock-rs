[package]
name = "bedrock_addon"
description = "Minecraft Bedrock Edition behaviour and resource packs as typed Rust data: manifests, containers, pack stacks, every content family, diagnostics and write-back; sans-IO"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license = "Apache-2.0"
readme = "README.md"

[package.metadata.docs.rs]
all-features = true
# Shows which feature each item needs.
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["zip", "encrypted", "molang", "nbt", "full"]
# infrastructure
zip = ["dep:zip"]                        # in-memory decoding and encoding of .mcpack/.zip/.mcaddon/.mctemplate
encrypted = ["zip", "dep:aes", "dep:cfb8", "dep:ctr"]   # marketplace content keys
molang = ["bedrock_addon_core/molang", "bedrock_addon_support/molang", "bedrock_addon_family_attachable?/molang", "bedrock_addon_family_biome?/molang", "bedrock_addon_family_block?/molang", "bedrock_addon_family_client_entity?/molang", "bedrock_addon_family_entity?/molang", "bedrock_addon_family_feature?/molang", "bedrock_addon_family_feature_rules?/molang", "bedrock_addon_family_geometry?/molang", "bedrock_addon_family_item?/molang", "bedrock_addon_family_particle?/molang", "bedrock_addon_family_recipe?/molang", "bedrock_addon_family_render_controller?/molang", "bedrock_addon_family_sounds_json?/molang"]   # load-time Molang compile check
nbt = ["dep:nbtx", "bedrock_addon_family_block?/nbt", "bedrock_addon_family_entity?/nbt", "bedrock_addon_family_item?/nbt"]                       # Block::to_network_nbt, Item::network_properties, …

# families: one feature per game document family, the module `families::<name>`
# behaviour pack
aim_assist = ["dep:bedrock_addon_family_aim_assist"]
behavior_tree = ["dep:bedrock_addon_family_behavior_tree"]
biome = ["dep:bedrock_addon_family_biome"]
block = ["dep:bedrock_addon_family_block"]
camera = ["dep:bedrock_addon_family_camera"]
crafting_catalog = ["dep:bedrock_addon_family_crafting_catalog"]
dialogue = ["dep:bedrock_addon_family_dialogue"]
dimension = ["dep:bedrock_addon_family_dimension"]
entity = ["dep:bedrock_addon_family_entity"]
feature = ["dep:bedrock_addon_family_feature"]
feature_rules = ["dep:bedrock_addon_family_feature_rules"]
function = ["dep:bedrock_addon_family_function"]
item = ["dep:bedrock_addon_family_item"]
jigsaw = ["dep:bedrock_addon_family_jigsaw"]
loot = ["dep:bedrock_addon_family_loot"]
poi = ["dep:bedrock_addon_family_poi"]
recipe = ["dep:bedrock_addon_family_recipe"]
script = ["dep:bedrock_addon_family_script"]
server_sound_definitions = ["dep:bedrock_addon_family_server_sound_definitions"]
spawn_groups = ["dep:bedrock_addon_family_spawn_groups"]
spawn_rules = ["dep:bedrock_addon_family_spawn_rules"]
structure = ["dep:bedrock_addon_family_structure", "dep:nbtx"]  # structure palettes are NBT compounds (pack/link/world/structure_block.rs)
trade = ["dep:bedrock_addon_family_trade"]
voxel_shape = ["dep:bedrock_addon_family_voxel_shape"]
# resource pack
animation = ["dep:bedrock_addon_family_animation"]
animation_controller = ["dep:bedrock_addon_family_animation_controller"]
atomic_client_entity = ["dep:bedrock_addon_family_atomic_client_entity"]
attachable = ["dep:bedrock_addon_family_attachable"]
biomes_client = ["dep:bedrock_addon_family_biomes_client"]
block_culling = ["dep:bedrock_addon_family_block_culling"]
blocks_json = ["dep:bedrock_addon_family_blocks_json"]
client_biome = ["dep:bedrock_addon_family_client_biome"]
client_entity = ["dep:bedrock_addon_family_client_entity"]
credits = ["dep:bedrock_addon_family_credits"]
ddui = ["dep:bedrock_addon_family_ddui"]
deferred_settings = ["dep:bedrock_addon_family_deferred_settings"]
flipbooks = ["dep:bedrock_addon_family_flipbooks"]
fog = ["dep:bedrock_addon_family_fog"]
font = ["dep:bedrock_addon_family_font"]
geometry = ["dep:bedrock_addon_family_geometry"]
json_ui = ["dep:bedrock_addon_family_json_ui"]
lang = ["dep:bedrock_addon_family_lang"]
languages = ["dep:bedrock_addon_family_languages"]
legacy_path_mapping = ["dep:bedrock_addon_family_legacy_path_mapping"]
loading_messages = ["dep:bedrock_addon_family_loading_messages"]
material = ["dep:bedrock_addon_family_material"]
music = ["dep:bedrock_addon_family_music"]
particle = ["dep:bedrock_addon_family_particle"]
persona = ["dep:bedrock_addon_family_persona"]
render_controller = ["dep:bedrock_addon_family_render_controller"]
skin = ["dep:bedrock_addon_family_skin"]
sound_definitions = ["dep:bedrock_addon_family_sound_definitions"]
sound_file = ["dep:bedrock_addon_family_sound_file"]
sounds_json = ["dep:bedrock_addon_family_sounds_json"]
splashes = ["dep:bedrock_addon_family_splashes"]
texture_atlas = ["dep:bedrock_addon_family_texture_atlas"]
texture_file = ["dep:bedrock_addon_family_texture_file"]
texture_list = ["dep:bedrock_addon_family_texture_list"]
texture_set = ["dep:bedrock_addon_family_texture_set"]
ui_texture_info = ["dep:bedrock_addon_family_ui_texture_info"]

