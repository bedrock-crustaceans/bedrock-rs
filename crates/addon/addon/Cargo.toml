    "poi",
    "recipe",
    "script",
    "server_sound_definitions",
    "spawn_groups",
    "spawn_rules",
    "structure",
    "trade",
    "voxel_shape",
    # resource pack
    "animation",
    "animation_controller",
    "atomic_client_entity",
    "attachable",
    "biomes_client",
    "block_culling",
    "blocks_json",
    "client_biome",
    "client_entity",
    "credits",
    "ddui",
    "deferred_settings",
    "flipbooks",
    "fog",
    "font",
    "geometry",
    "json_ui",
    "lang",
    "languages",
    "legacy_path_mapping",
    "loading_messages",
    "material",
    "music",
    "particle",
    "persona",
    "render_controller",
    "skin",
    "sound_definitions",
    "sound_file",
    "sounds_json",
    "splashes",
    "texture_atlas",
    "texture_file",
    "texture_list",
    "texture_set",
    "ui_texture_info",
]
# optional checks, off by default (not in `default`, not in `full`)
script-syntax = ["script", "bedrock_addon_family_script?/script-syntax"]   # full JS syntax check of script files

