# Shared by every crate under crates/addon/ except core and std, which carry their own clippy.toml
# (nearest file wins, no merging).
# Sans-IO enforcement: the core never touches the host (files, threads, clock, environment).
# Test code may read fixtures and carries `#![allow(clippy::disallowed_methods, clippy::disallowed_types)]`.
disallowed-methods = [
    { path = "std::fs::read", reason = "no host I/O in the core: a loader asks for bytes through an Output" },
    { path = "std::fs::read_to_string", reason = "no host I/O in the core" },
    { path = "std::fs::read_dir", reason = "no host I/O in the core: directory listings are Input::Dir" },
    { path = "std::fs::read_link", reason = "no host I/O in the core" },
    { path = "std::fs::write", reason = "no host I/O in the core: bytes go out through PackWriter" },
    { path = "std::fs::metadata", reason = "no host I/O in the core" },
    { path = "std::fs::symlink_metadata", reason = "no host I/O in the core" },
    { path = "std::fs::create_dir", reason = "no host I/O in the core" },
    { path = "std::fs::create_dir_all", reason = "no host I/O in the core" },
    { path = "std::fs::remove_dir", reason = "no host I/O in the core" },
    { path = "std::fs::remove_dir_all", reason = "no host I/O in the core" },
    { path = "std::fs::remove_file", reason = "no host I/O in the core" },
    { path = "std::fs::rename", reason = "no host I/O in the core" },
    { path = "std::fs::copy", reason = "no host I/O in the core" },
    { path = "std::fs::hard_link", reason = "no host I/O in the core" },
    { path = "std::fs::soft_link", reason = "no host I/O in the core" },
    { path = "std::fs::canonicalize", reason = "no host I/O in the core" },
    { path = "std::fs::set_permissions", reason = "no host I/O in the core" },
    { path = "std::fs::exists", reason = "no host I/O in the core" },
    { path = "std::fs::File::open", reason = "no host I/O in the core" },
    { path = "std::fs::File::create", reason = "no host I/O in the core" },
    { path = "std::fs::File::create_new", reason = "no host I/O in the core" },
    { path = "std::fs::File::options", reason = "no host I/O in the core" },
    { path = "std::fs::OpenOptions::open", reason = "no host I/O in the core" },
    { path = "std::thread::spawn", reason = "the core starts no threads: CPU work is a Job the caller runs" },
    { path = "std::thread::Builder::spawn", reason = "the core starts no threads" },
    { path = "std::env::var", reason = "the core reads no environment" },
    { path = "std::env::var_os", reason = "the core reads no environment" },
    { path = "std::env::vars", reason = "the core reads no environment" },
    { path = "std::env::current_dir", reason = "the core reads no environment" },
    { path = "std::time::SystemTime::now", reason = "the core reads no clock" },
    { path = "std::time::Instant::now", reason = "the core reads no clock" },
    { path = "zip::read::ZipArchive::extract", reason = "zip is decoded over Cursor<Bytes>; never to disk" },
    { path = "zip::read::ZipArchive::extract_unwrapped_root_dir", reason = "zip is decoded over Cursor<Bytes>; never to disk" },
    # The door: facet-json reads and writes by a call of itself for each level, has no nesting
    # limit and decodes a bad escape out of bounds. `bedrock_addon_core::json` is its one caller.
    { path = "facet_json::from_str", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_str_borrowed", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice_borrowed", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_str_into", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice_into", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_str_into_borrowed", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice_into_borrowed", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_str_jsonc", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice_jsonc", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_str_borrowed_jsonc", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice_borrowed_jsonc", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::to_vec", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_vec_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_vec_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_string", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_string_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_string_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::peek_to_string", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::peek_to_string_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::peek_to_string_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_writer_std", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_writer_std_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_writer_std_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::peek_to_writer_std", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::peek_to_writer_std_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::peek_to_writer_std_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
]
disallowed-types = [
    { path = "std::fs::File", reason = "no host I/O in the core" },
    { path = "std::path::PathBuf", reason = "host paths never enter the core: a location is a RootId plus a PackPath" },
    { path = "std::net::TcpStream", reason = "no network in the core" },
    { path = "std::net::UdpSocket", reason = "no network in the core" },
    # The door, as above: a walk driven through facet-format with facet-json's own parser or
    # serializer is a read or a write past it.
    { path = "facet_json::JsonParser", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::JsonSerializer", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
]
