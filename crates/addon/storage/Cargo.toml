[package]
name = "bedrock_addon_storage"
description = "The containers of a Minecraft Bedrock pack as plain functions over bytes: zip, marketplace encryption, brarchive and MCB documents; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Both on by default, so `cargo nextest run -p bedrock_addon_storage` runs every test;
# `bedrock_addon` takes the crate with `default-features = false` and forwards its own two.
default = ["zip", "encrypted"]
zip = ["dep:zip"]                                       # in-memory decoding and encoding of .mcpack/.zip/.mcaddon/.mctemplate
encrypted = ["zip", "dep:aes", "dep:cfb8", "dep:ctr"]   # marketplace content keys

[dependencies]
bedrock_addon_core = { path = "../core" }
brarchive = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
facet = { workspace = true }
facet-json = { workspace = true }   # the type `DeserializeError` only: reads go through core's door
zip = { workspace = true, optional = true }
aes = { workspace = true, optional = true }
cfb8 = { workspace = true, optional = true }
ctr = { workspace = true, optional = true }

[dev-dependencies]
facet-value = { workspace = true }
# The cost test of the MCB reader (`test_cost`).
bedrock_addon_core = { path = "../core", features = ["test-cost"] }
