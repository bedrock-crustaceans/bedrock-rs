# The join table of `cargo xtask actor-types` (xtask/src/actor_types.rs): every entity identifier
# of the game's `mojang-entities.json` metadata mapped to vanilla's numeric `ActorType`, the value
# the game's entity-type lookup gives for it. The generator fails when an identifier of the
# metadata has no row here or a row names no identifier there.
#
# Each row's comment names the `ActorType` enumerator the value belongs to. Identifier and
# enumerator are paired by name; a row marked `(paired by hand)` pairs names that differ
# (`magma_cube` is `LavaSlime`). The low byte of a value is the type, the higher bits its
# categories (0x100 mob, 0x300 pathfinder mob, 0xb00 monster, 0x1300 animal, 0x80000 minecart,
# 0x400000 projectile, ...).

[types]
