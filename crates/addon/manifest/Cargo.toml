[package]
name = "bedrock_addon_manifest"
description = "The pack manifest of the bedrock_addon crate family: legacy (0/1/2) and comprehensive (3) manifest.json read into one model and written back, and the capability registry; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bedrock_addon_core = { path = "../core" }
facet = { workspace = true }
facet-value = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
bedrock_addon_core = { path = "../core", features = ["test-cost"] }
