[package]
name = "bedrock_addon_derive"
description = "The proc-macros of the bedrock_addon crate family: #[derive(Components)] (Component impls, From<T> for the family's component enum and the static component tables) and #[derive(Schema)] (the impls a typed document struct's schema:: attributes state)"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
syn = { workspace = true }
quote = { workspace = true }
# The rule facet's `rename_all` applies, so the JSON names `Schema` emits are facet's.
facet-macro-types = { workspace = true }

[dev-dependencies]
# The expansion tests implement core's traits on a toy family.
bedrock_addon_core = { path = "../core" }
# The `Schema` expansion tests derive `Facet` beside it.
facet = { workspace = true }
indexmap = { workspace = true }
# `compile_fail` cases with their expected compiler errors (tests/ui).
trybuild = "1"
