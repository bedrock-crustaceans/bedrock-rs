[package]
name = "bedrock_addon_family_particle"
description = "The `particle` content family of bedrock_addon, re-exported as bedrock_addon::families::particle; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
molang = ["bedrock_addon_core/molang"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
bedrock_addon_shared_shapes = { path = "../../shared/shapes" }
bedrock_addon_derive = { path = "../../derive" }
facet-json = { workspace = true }
facet-value = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
bedrock_addon_core = { path = "../../core", features = ["test-cost"] }
