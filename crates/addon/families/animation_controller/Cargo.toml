[package]
name = "bedrock_addon_family_animation_controller"
description = "The `animation_controller` content family of bedrock_addon, re-exported as bedrock_addon::families::animation_controller; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# The load-time Molang compile check of the file's Molang members.
molang = ["bedrock_addon_shared_animation/molang"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
bedrock_addon_shared_shapes = { path = "../../shared/shapes" }
bedrock_addon_shared_animation = { path = "../../shared/animation" }
indexmap = { workspace = true }
