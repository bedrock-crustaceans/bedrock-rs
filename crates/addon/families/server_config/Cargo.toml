[package]
name = "bedrock_addon_family_server_config"
description = "The script configuration of a dedicated server (its `config/` folder and `server.properties`) for bedrock_addon, re-exported as bedrock_addon::families::server_config; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
bedrock_addon_family_script = { path = "../script" }
bytes = { workspace = true }
facet-json = { workspace = true }
facet-value = { workspace = true }
indexmap = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# The cost tests (`test_cost`).
bedrock_addon_core = { path = "../../core", features = ["test-cost"] }
# The one line of a skipped corpus test (`corpus::skipped`).
bedrock_addon_test_support = { path = "../../test_support" }
