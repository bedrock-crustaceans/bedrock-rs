[package]
name = "bedrock_addon_family_entity"
description = "The `entity` content family of bedrock_addon, re-exported as bedrock_addon::families::entity; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
nbt = ["dep:nbtx"]
molang = ["bedrock_addon_core/molang"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
bedrock_addon_shared_shapes = { path = "../../shared/shapes" }
bedrock_addon_derive = { path = "../../derive" }
facet = { workspace = true }
facet-json = { workspace = true }
facet-value = { workspace = true }
indexmap = { workspace = true }
nbtx = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
# The helpers the tests of the addon crates share.
bedrock_addon_test_support = { path = "../../test_support" }
bedrock_addon_core = { path = "../../core", features = ["test-cost"] }
uuid = { workspace = true }
