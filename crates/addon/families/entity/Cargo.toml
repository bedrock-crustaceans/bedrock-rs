[package]
name = "bedrock_addon_family_entity"
description = "The `entity` content family of bedrock_addon, re-exported as bedrock_addon::families::entity; sans-IO"
version.workspace = true
edition.workspace = true
rust-version = "1.98"
license = "Apache-2.0"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
nbt = ["dep:nbtx"]
molang = ["bedrock_addon_core/molang", "bedrock_addon_support/molang"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
bedrock_addon_support = { path = "../../support" }
bedrock_addon_derive = { path = "../../derive" }
facet = { workspace = true }
facet-json = { workspace = true }
facet-value = { workspace = true }
indexmap = { workspace = true }
nbtx = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }

[lints]
workspace = true
