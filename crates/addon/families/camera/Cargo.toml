[package]
name = "bedrock_addon_family_camera"
description = "The `camera` content family of bedrock_addon, re-exported as bedrock_addon::families::camera; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
facet = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
# The helpers the tests of the addon crates share.
bedrock_addon_test_support = { path = "../../test_support" }
# entity.rs compares written text with its fixture as json Values.
facet-json = { workspace = true }
