[package]
name = "bedrock_addon_family_blocks_json"
description = "The `blocks_json` content family of bedrock_addon, re-exported as bedrock_addon::families::blocks_json; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
facet-json = { workspace = true }
facet-value = { workspace = true }
indexmap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bedrock_addon_core = { path = "../../core", features = ["test-cost"] }
