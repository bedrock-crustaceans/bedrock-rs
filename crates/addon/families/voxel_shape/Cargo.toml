[package]
name = "bedrock_addon_family_voxel_shape"
description = "The `voxel_shape` content family of bedrock_addon, re-exported as bedrock_addon::families::voxel_shape; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
facet = { workspace = true }
facet-json = { workspace = true }
facet-value = { workspace = true }

[dev-dependencies]
# The helpers the tests of the addon crates share.
bedrock_addon_test_support = { path = "../../test_support" }
