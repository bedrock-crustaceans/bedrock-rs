[package]
name = "bedrock_addon_family_lang"
description = "The `lang` and `languages` content families of bedrock_addon, re-exported as bedrock_addon::families::lang and bedrock_addon::families::languages; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
indexmap = { workspace = true }

[dev-dependencies]
bedrock_addon_test_support = { path = "../../test_support" }
uuid = { workspace = true }
