[package]
name = "bedrock_addon_family_skin"
description = "The `skin` content family of bedrock_addon, re-exported as bedrock_addon::families::skin; sans-IO"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
bedrock_addon_core = { path = "../../core" }
bedrock_addon_shared_shapes = { path = "../../shared/shapes" }
facet-value = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bedrock_addon_core = { path = "../../core", features = ["test-cost"] }
