[package]
name = "bedrock_level"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[features]
deny-unknown-fields = []
default = ["deny-unknown-fields"]

[[bench]]
name = "subchunk"
harness = false

[[bench]]
name = "unpack"
harness = false

[dependencies]
leveldb = { git = "https://github.com/bedrock-crustaceans/leveldb" }
miniz_oxide = { version = "0.9" }
zlib-rs = { version = "0.6", default-features = false, features = ["std", "c-allocator"] }

bedrock_shared = { path = "../shared" }
nbtx.workspace = true
# `#[derive(Facet)]` expands to `::facet::`-rooted paths, so a crate that derives it needs
# facet directly.
facet.workspace = true
# `nbtx::Value::String` and `Compound` keys are raw bytes (`bstr::BString`).
bstr.workspace = true
# Order-preserving map for `BlockDef::states`; facet implements `Facet` for it through the
# workspace's `indexmap` feature.
indexmap.workspace = true

thiserror.workspace = true
byteorder.workspace = true
bytemuck.workspace = true
smallvec = "1.15.1"
rustc-hash = "2.1.1"
nohash-hasher = "0.2.0"
paste.workspace = true

[dev-dependencies]
tar.workspace = true
flate2.workspace = true
tempfile.workspace = true
criterion.workspace = true
proptest.workspace = true
# Parses the test-fixture index (`tests/fixtures/index.json`) through the same
# `#[derive(Facet)]` machinery `nbtx` uses, rather than adding a second JSON stack.
facet-json.workspace = true
