[package]
name = "bedrock_level"
version = "0.1.0"
edition = "2024"

[features]
deny-unknown-fields = []
default = ["deny-unknown-fields"]

[[bench]]
name = "subchunk"
harness = false

[[bench]]
name = "unpack"
harness = false

[dependencies]
rusty-leveldb = { git = "https://github.com/bedrock-crustaceans/rusty-leveldb", rev = "3365b32b747ad50fefdd8b6a6f988dacf357a114" }
miniz_oxide = { version = "0.9.0" }

bedrock_shared = { path = "../shared" }
nbtx = { workspace = true }
# `#[derive(Facet)]` expands to `::facet::`-rooted paths, so a crate that
# derives it needs facet directly, at the rev nbtx pins.
facet = { workspace = true }
# `nbtx::Value::String` and `Compound` keys are raw bytes (`bstr::BString`).
bstr = { workspace = true }

thiserror = { workspace = true }
byteorder = { workspace = true }
bytemuck = { workspace = true }
smallvec = "1.15.1"
rustc-hash = "2.1.1"
nohash-hasher = "0.2.0"
paste.workspace = true

[dev-dependencies]
tar = { workspace = true }
flate2 = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
# Parses the test-fixture index (`tests/fixtures/index.json`) through the
# same `#[derive(Facet)]` machinery `nbtx` uses, rather than adding a second
# JSON stack. Pinned to the exact rev `facet` uses above, so the graph keeps
# one `facet-core` rather than two incompatible `Shape` types.
facet-json = { git = "https://github.com/facet-rs/facet", rev = "bbce10cbd1ddd535b0d812ccbf9456f7ff7d58cf" }
