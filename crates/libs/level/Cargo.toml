[package]
name = "bedrock_level"
version.workspace = true
edition.workspace = true

[features]
default = []

[[bench]]
name = "subchunk"
harness = false

[[bench]]
name = "unpack"
harness = false

[dependencies]
rusty-leveldb = { git = "https://github.com/bedrock-crustaceans/rusty-leveldb", rev = "3365b32b747ad50fefdd8b6a6f988dacf357a114" }
miniz_oxide = { version = "0.9" }

bedrock_shared = { path = "../shared" }
nbtx = { workspace = true }
facet = { workspace = true }

thiserror = { workspace = true }
serde = { workspace = true }
byteorder = { workspace = true }
bytemuck = { workspace = true }
smallvec = "1.15.1"
rustc-hash = "2.1.1"
nohash-hasher = "0.2.0"

[dev-dependencies]
tar = { workspace = true }
flate2 = { workspace = true }
tempfile = { workspace = true }
criterion = { workspace = true }
