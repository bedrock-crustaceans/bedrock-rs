bedrock_protocol_v898 = { path = "../version/v898", default-features = false }
bedrock_protocol_v924 = { path = "../version/v924", default-features = false }
bedrock_protocol_v944 = { path = "../version/v944", default-features = false }
bedrock_protocol_v975 = { path = "../version/v975", default-features = false }
bedrock_protocol_v1001 = { path = "../version/v1001", default-features = false }
bedrock_protocol_v2168 = { path = "../version/v2168", default-features = false }
bedrock_protocol_v2168hotfix4 = { path = "../version/v2168hotfix4", default-features = false }
bedrock_protocol_v2169 = { path = "../version/v2169", default-features = false }
bedrock_protocol_v2193 = { path = "../version/v2193", default-features = false }
bedrock_protocol_v2225 = { path = "../version/v2225", default-features = false }
# end generated: the version crates

[dev-dependencies]
bedrock_macros = { path = "../macros" }
nbtx.workspace = true
tracing.workspace = true

[features]
packet-trace = ["bedrock_protocol_core/packet-trace"]
# `default` is the newest version; `v<N>` turns on the packet enum `V<N>` of that version, `all`
# every one of them; `packet-dyn` and `packet-meta` forward to core and to every version crate.
# begin generated by `cargo xtask`: the version features
