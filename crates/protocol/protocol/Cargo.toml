[package]
name = "bedrock_protocol"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
bedrock_protocol_core = { path = "../core" }
bedrock_protocol_version = { path = "../version/traits" }
# One crate per protocol version, each without its default feature: the packet enum of a version
# compiles only when the feature of that version below is on.
# begin generated by `cargo xtask`: the version crates
bedrock_protocol_unknown = { path = "../version/unknown", default-features = false }
bedrock_protocol_v662 = { path = "../version/v662", default-features = false }
bedrock_protocol_v671 = { path = "../version/v671", default-features = false }
bedrock_protocol_v685 = { path = "../version/v685", default-features = false }
bedrock_protocol_v686 = { path = "../version/v686", default-features = false }
bedrock_protocol_v712 = { path = "../version/v712", default-features = false }
bedrock_protocol_v729 = { path = "../version/v729", default-features = false }
bedrock_protocol_v748 = { path = "../version/v748", default-features = false }
bedrock_protocol_v766 = { path = "../version/v766", default-features = false }
bedrock_protocol_v776 = { path = "../version/v776", default-features = false }
bedrock_protocol_v786 = { path = "../version/v786", default-features = false }
bedrock_protocol_v800 = { path = "../version/v800", default-features = false }
bedrock_protocol_v818 = { path = "../version/v818", default-features = false }
bedrock_protocol_v819 = { path = "../version/v819", default-features = false }
