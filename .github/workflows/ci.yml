name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces; runs on `main` always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # No debug info and no incremental files: the test binaries outgrow the runners' disks with them.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features

  # The workspace is tested in groups, one job per group and OS. Each job builds only its group's
  # test binaries, which keeps every job inside the runner's disk and runs the groups in parallel.
  # `rest` is every crate no other group names, so a new crate is tested without touching this.
  test:
    name: Test ${{ matrix.group.name }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        group:
          - name: protocol
            packages: -p bedrock_protocol -p bedrock_protocol_core -p bedrock_macros
          # `--all-features` stands in for the `molang` and `nbt` features `bedrock_addon` turns on
          # in a whole-workspace build, and adds the script family's `script-syntax`.
          - name: addon-core
            packages: >-
              --all-features
              -p bedrock_addon_core -p bedrock_addon_derive -p bedrock_addon_support
              -p 'bedrock_addon_family_*'
          - name: addon
            packages: -p bedrock_addon
          - name: addon-std
            packages: -p bedrock_addon_std
          - name: rest
            packages: >-
              --workspace
              --exclude bedrock_protocol --exclude bedrock_protocol_core --exclude bedrock_macros
              --exclude 'bedrock_addon*'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.group.name }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests
        shell: bash
        run: cargo nextest run --profile ci ${{ matrix.group.packages }}
      # nextest does not run doctests.
      - name: Doctests
        shell: bash
        run: cargo test --doc ${{ matrix.group.packages }}
