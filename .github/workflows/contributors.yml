name: Contributors

# Draws everyone in the history of `main` into `contributors.svg` once a day and publishes it as
# the only file on the orphan branch `contributors`, which the README shows. Publishing there
# keeps the daily commit out of `main`'s history.

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contributors

jobs:
  draw:
    name: Draw contributors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Draw
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/contributors.py --out "$RUNNER_TEMP/contributors.svg"

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          drawing="$RUNNER_TEMP/contributors.svg"
          if git fetch -q --depth=1 origin contributors 2>/dev/null \
            && git show FETCH_HEAD:contributors.svg | cmp -s - "$drawing"; then
            echo "The drawing is unchanged."
            exit 0
          fi
          site="$RUNNER_TEMP/site"
          mkdir "$site"
          cp "$drawing" "$site/"
          cd "$site"
          git init -q -b contributors
          git add contributors.svg
          git -c user.name="github-actions[bot]" \
            -c user.email="41898273+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: draw contributors"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" contributors
