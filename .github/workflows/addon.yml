name: addon

# The checks of the four addon crates (bedrock_addon_core, bedrock_addon_derive, bedrock_addon,
# bedrock_addon_std) and of the facade features that re-export them.
#
# Not here, on purpose:
# - Formatting. `cargo fmt --all -- --check` is workspace-wide and is the `fmt` job of ci.yml.
# - An MSRV job. The four crates declare `rust-version = "1.98"` and every job runs on stable,
#   so the declared minimum is not built with an older toolchain.

on:
  push:
    branches:
      - main
      - feat/addon
    paths:
      - "crates/addon/**"
      # The addon manifests take their dependencies from the workspace.
      - "Cargo.toml"
      # The facade's `addon` and `addon-std` features.
      - "bedrock/**"
      # The script_meta generator builds bedrock_addon with `script`.
      - "xtask/**"
      - ".github/workflows/addon.yml"
  pull_request:
    paths:
      - "crates/addon/**"
      - "Cargo.toml"
      - "bedrock/**"
      - "xtask/**"
      - ".github/workflows/addon.yml"

permissions:
  contents: read

jobs:
  check:
    name: Check (features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo check -p bedrock_addon --no-default-features
      - run: cargo check --workspace --all-features
      # The facade re-exports the two crates behind one feature each.
      - run: cargo check -p bedrock --features addon
      - run: cargo check -p bedrock --features addon-std
      # `--no-dev-deps` rewrites the Cargo.toml files of the checkout while it runs and restores
      # them afterwards. Each job has a checkout of its own, so nothing else reads them here; in
      # a shared checkout run these two last and alone, then `git status`.
      - run: cargo hack check -p bedrock_addon --each-feature --no-dev-deps
      - run: cargo hack check -p bedrock_addon_std --each-feature --no-dev-deps

  clippy:
    name: Clippy (pedantic, sans-IO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `-D warnings` is on the command, not in RUSTFLAGS: dependencies are not rebuilt for it.
      - run: cargo clippy -p bedrock_addon_core -p bedrock_addon_derive -p bedrock_addon -p bedrock_addon_std --all-targets --all-features -- -D warnings
      # The sans-IO lists of crates/addon/clippy.toml and crates/addon/core/clippy.toml.
      - run: cargo clippy -p bedrock_addon -p bedrock_addon_core --all-features -- -D clippy::disallowed_methods -D clippy::disallowed_types
      # The tests without the default features: a test gated on a feature must not leave an
      # import or a helper unused when the feature is off.
      - run: cargo clippy -p bedrock_addon --no-default-features --tests -- -D warnings
      - run: cargo clippy -p bedrock_addon_std --no-default-features --tests -- -D warnings

  sans-io-tree:
    name: Dependency tree (sans-IO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # None of these may reach bedrock_addon's normal dependency graph, directly or through a
      # dependency. `--prefix none` puts every crate name at the start of its line. The tree is
      # taken first, on a line of its own: a `cargo tree` that fails must fail the step, and
      # inside the `if` it would read as "nothing found".
      - run: |
          tree="$(cargo tree -p bedrock_addon -e normal --all-features --prefix none)"
          if grep -E '^(rayon|tokio|walkdir|notify|memmap2) v' <<<"$tree"; then
            echo "bedrock_addon depends on an I/O or threading crate" >&2
            exit 1
          fi
      # The same for the facade with `addon` alone: `addon-std` is the feature that may do I/O.
      - run: |
          tree="$(cargo tree -p bedrock -e normal --features addon --prefix none)"
          if grep -E '^(rayon|tokio|walkdir|notify|memmap2) v' <<<"$tree"; then
            echo "bedrock with the addon feature depends on an I/O or threading crate" >&2
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Unit tests, integration tests and doctests: the README code blocks and the
      # `compile_fail` doctests of the empty crate roots are doctests, so they run here.
      # `--all-features` includes `script-syntax`, which is in neither `default` nor `full`.
      # `module_independence` and `determinism` are test binaries of bedrock_addon.
      #
      # The `full*` tests and the vanilla gate need the game's own packs, which are not in the
      # repository: without BEDROCK_ADDON_CORPUS (and BEDROCK_ADDON_VANILLA_1_26_60 for the
      # vanilla gate) they skip. A skip is not a pass; those tests only run on a machine that has
      # the game's files.
      - run: cargo test -p bedrock_addon_core -p bedrock_addon_derive -p bedrock_addon -p bedrock_addon_std --all-features
      - run: cargo test -p bedrock_addon_core -p bedrock_addon --no-default-features
      # The script metadata generator and its tests live in xtask; they hold the committed tables
      # of bedrock_addon against drift.
      - run: cargo test -p xtask

  link-features:
    # The link tests with one content feature alone: a rule, or a test of "without the
    # feature nothing is told", that needs another family must not hide behind `full`.
    # `cargo hack --each-feature` in the check job only compiles, and builds no test.
    name: Link tests (${{ matrix.feature }} alone)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The family features of crates/addon/addon/Cargo.toml (the list of `full`).
        feature:
          - aim_assist
          - animation
          - animation_controller
          - atomic_client_entity
          - attachable
          - behavior_tree
          - biome
          - biomes_client
          - block
          - block_culling
          - blocks_json
          - camera
          - client_biome
          - client_entity
          - crafting_catalog
          - credits
          - ddui
          - deferred_settings
          - dialogue
          - dimension
          - entity
          - feature
          - feature_rules
          - flipbooks
          - fog
          - font
          - function
          - geometry
          - item
          - jigsaw
          - json_ui
          - lang
          - languages
          - legacy_path_mapping
          - loading_messages
          - loot
          - material
          - music
          - particle
          - persona
          - poi
          - recipe
          - render_controller
          - script
          - server_sound_definitions
          - skin
          - sound_definitions
          - sound_file
          - sounds_json
          - spawn_groups
          - spawn_rules
          - splashes
          - structure
          - texture_atlas
          - texture_file
          - texture_list
          - texture_set
          - trade
          - ui_texture_info
          - voxel_shape
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.feature }}
      - run: cargo test -p bedrock_addon --no-default-features --features ${{ matrix.feature }} --test link

  cost:
    # The cost tests alone, one thread at a time: in the test job they share the machine with
    # the rest of the suite, and a timing measured beside other tests says little.
    # The filters are libtest's, after one `--`; a second `--` would make `--test-threads=1`
    # one more filter.
    name: Cost tests (alone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p bedrock_addon --all-features --lib -- cost linear --test-threads=1
      # Every integration binary that includes the cost helpers, by file: a new one needs no
      # line here.
      - run: |
          for file in $(grep -l 'src/test_cost.rs' crates/addon/addon/tests/*.rs); do
            binary="$(basename "$file" .rs)"
            echo "::group::$binary"
            cargo test -p bedrock_addon --all-features --test "$binary" -- cost linear --test-threads=1
            echo "::endgroup::"
          done

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p bedrock_addon -p bedrock_addon_std --all-features --examples
      # Every example is run, by file: a new example needs no line here. Each one takes no
      # argument and exits 0. A crate without an `examples` directory has none to run.
      - run: |
          for entry in bedrock_addon:crates/addon/addon bedrock_addon_std:crates/addon/std; do
            crate="${entry%%:*}"
            for file in "${entry#*:}"/examples/*.rs; do
              [ -e "$file" ] || continue
              example="$(basename "$file" .rs)"
              echo "::group::$crate: $example"
              cargo run -p "$crate" --all-features --example "$example"
              echo "::endgroup::"
            done
          done

  doc:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features -p bedrock_addon_core -p bedrock_addon_derive -p bedrock_addon -p bedrock_addon_std

  wasm:
    # Non-blocking, and red today: `uuid` refuses wasm32-unknown-unknown without a randomness
    # feature. zip's deflate backend does build for the target, so the job can become blocking
    # once a manifest gives `uuid` that feature.
    name: Check (wasm32, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      # getrandom's wasm backend, selected by the check's own build configuration, never in a manifest.
      RUSTFLAGS: --cfg getrandom_backend="wasm_js"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p bedrock_addon --all-features --target wasm32-unknown-unknown

  timings:
    # The `bedrock_addon` row of each report, median of three, against 60 s for a clean debug
    # build and 15 s for a rebuild after touching one family. It reports and never fails the
    # workflow; the numbers inform whether the crate should be split, and nothing is split by a
    # number alone.
    name: Build timings (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      # No rust-cache: a restored target directory is not a clean build.
      - name: Clean build, three times
        run: |
          for run in 1 2 3; do
            cargo clean -p bedrock_addon
            cargo build -p bedrock_addon --all-features --timings
          done
      # The first run fills the incremental cache and is not one of the three.
      - name: Incremental rebuild, three times
        env:
          CARGO_INCREMENTAL: 1
        run: |
          for run in prime 1 2 3; do
            touch crates/addon/families/entity/src/component/mod.rs
            cargo build -p bedrock_addon --all-features --timings
          done
      - uses: actions/upload-artifact@v6
        with:
          name: cargo-timings
          path: target/cargo-timings/
