    { path = "facet_json::to_writer_std", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_writer_std_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_writer_std_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::peek_to_writer_std", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::peek_to_writer_std_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
