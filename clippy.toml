# Workspace-wide clippy configuration. The lint levels themselves (pedantic on) live in the
# `[workspace.lints]` table of `Cargo.toml`; this file only configures lints.

# facet-json reads and writes by a call of itself for each level, has no nesting limit and
# decodes a bad escape out of bounds. The add-on crates read every text with
# `bedrock_addon_core::json::parse` and write with `bedrock_addon_core::json`'s writers, and call
# none of these; a crate that does (`bedrock_form`) carries the allow.
disallowed-methods = [
    { path = "facet_json::from_str", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_slice", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_str_borrowed", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_slice_borrowed", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_str_into", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_slice_into", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_str_into_borrowed", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_slice_into_borrowed", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_str_jsonc", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_slice_jsonc", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_str_borrowed_jsonc", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::from_slice_borrowed_jsonc", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::to_vec", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::to_vec_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::to_vec_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::to_string", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::to_string_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::to_string_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::peek_to_string", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::peek_to_string_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::peek_to_string_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::to_writer_std", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::to_writer_std_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::to_writer_std_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::peek_to_writer_std", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::peek_to_writer_std_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
    { path = "facet_json::peek_to_writer_std_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
]
disallowed-types = [
    # As above: a walk driven through facet-format with facet-json's own parser or serializer
    # is a read or a write past the crate's reader and writers.
    { path = "facet_json::JsonParser", reason = "read through bedrock_addon_core::json::parse: it bounds the depth and refuses a bad escape" },
    { path = "facet_json::JsonSerializer", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): they bound the depth" },
]
