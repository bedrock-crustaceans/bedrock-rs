# Workspace-wide clippy configuration. The lint levels themselves (pedantic on) live in the
# `[workspace.lints]` table of `Cargo.toml`; this file only configures lints.

# The JSON door: facet-json reads and writes by a call of itself for each level, has no nesting
# limit and decodes a bad escape out of bounds. `bedrock_addon_core::json` is its one caller and
# carries the allow.
disallowed-methods = [
    { path = "facet_json::from_str", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_str_borrowed", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice_borrowed", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_str_into", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice_into", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_str_into_borrowed", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice_into_borrowed", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_str_jsonc", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice_jsonc", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_str_borrowed_jsonc", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::from_slice_borrowed_jsonc", reason = "read through bedrock_addon_core::json (from_str_jsonc, parse_at): the door scans the text and sizes the stack" },
    { path = "facet_json::to_vec", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_vec_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_vec_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_string", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_string_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::to_string_with_options", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::peek_to_string", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
    { path = "facet_json::peek_to_string_pretty", reason = "write through bedrock_addon_core::json (write_json, to_json, to_facet_json): the door bounds the depth and sizes the stack" },
