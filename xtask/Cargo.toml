[package]
name = "xtask"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
# `span-locations`: a definition error is reported with the line and column of its span.
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
quote = "1.0.45"
syn = { version = "3.0.6", features = ["full"] }
prettyplease = "0.3.0"
# `addon-features` reads the family crates' manifests and the composing crate's.
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
# `script-meta` parses the game's metadata files with the strict model of the script family.
bedrock_addon_core = { path = "../crates/addon/core" }
bedrock_addon_family_script = { path = "../crates/addon/families/script" }

[dev-dependencies]
# The one line of a skipped corpus test (`corpus::skipped`); it builds core with no feature
# beyond the ones above.
bedrock_addon_test_support = { path = "../crates/addon/test_support" }
# The tree the protocol generator's edge reads and writes, in a test.
tempfile.workspace = true
