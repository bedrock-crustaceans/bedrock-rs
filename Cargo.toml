[workspace]
members = [
    "bedrock",
    "crates/auth",
    "crates/form",
    "crates/level",
    "crates/macros",
    "crates/network",
    "crates/protocol",
    "crates/protocol_core",
    "crates/shared",
    "crates/addon/addon",
    "crates/addon/core",
    "crates/addon/derive",
    "crates/addon/std",
    "crates/addon/support",
    "crates/addon/families/*",
    "xtask",
]
resolver = "3"

# The lints of the addon crates (`[lints] workspace = true` in each). Cargo applies them to every
# target, so each test, example and bench root opts out with
# `#![allow(clippy::pedantic, missing_docs)]`: test code is not held to the library's lints.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# `#[must_use]` goes on methods returning a changed copy and on values whose loss is a bug, not
# on every pure getter.
must_use_candidate = "allow"
# The error enums' variants document each failure.
missing_errors_doc = "allow"
# A panic here is a broken invariant of the crate, never an outcome a caller handles, so no
# function carries a `# Panics` section.
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2.0"
vek = "0.17"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
byteorder = "1.5.0"
bytemuck = "1.25.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "sync", "time", "tracing"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_repr = "0.1.20"
facet = { version = "0.50.0-rc.7", features = ["indexmap"] }
facet-json = "0.50.0-rc.7"
facet-format = "0.50.0-rc.7"
facet-value = "0.50.0-rc.7"
facet-path = "0.50.0-rc.7" # `DeserializeError.path` steps for `json::parse_at`
paste = "1.0"
tar = "0.4.44"
tempfile = "3.26.0"
flate2 = "1.0"
snap = "1.1"
criterion = { version = "0.8.2", features = ["html_reports"] }
seq-macro = "0.3"
proc-macro2 = "1.0"
syn = { version = "3.0.3", features = ["derive", "parsing", "printing", "proc-macro"] }
quote = { version = "1.0" }
base64 = "0.23.0"
# TODO: switch this back to crates.io after 4.0.0 release
nbtx = { git = "https://github.com/bedrock-crustaceans/nbtx" }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
p384 = "0.14.0"
sha2 = "0.11.0"
rand = "0.10"
strum = "0.28.0"
strum_macros = "0.28.0"
reqwest = "0.13.2"
# bedrock_addon family (crates/addon/core, addon/derive, addon/addon, addon/std)
# A git dependency until the crate is published.
molangx = { git = "https://github.com/bedrock-crustaceans/molangx", rev = "ffa4a4206903def0f1c4ee8b595378df54ab984c", default-features = false }
indexmap = "2"
bytes = "1"
stacker = "0.1.25" # the stack of a typed JSON read, grown on the thread that reads
zip = { version = "8", default-features = false, features = ["deflate"] }
aes = "0.8"
cfb8 = "0.8"
ctr = "0.9"
rayon = "1"
oxc_parser = "0.153"
brarchive = "0.4"
