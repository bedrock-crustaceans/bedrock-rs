[package]
name = "bedrock"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
bedrock_auth = { path = "../crates/auth", optional = true }
bedrock_shared = { path = "../crates/shared" }
bedrock_network_macros = { path = "../crates/network/macros", optional = true }
bedrock_form = { path = "../crates/form", optional = true }
bedrock_network_protocol = { path = "../crates/network/protocol", optional = true }
bedrock_network_core = { path = "../crates/network/core", optional = true }
bedrock_network = { path = "../crates/network/network", optional = true, default-features = false }
bedrock_level = { path = "../crates/level", optional = true }
bedrock_addon = { path = "../crates/addon/addon", optional = true }
bedrock_addon_std = { path = "../crates/addon/std", optional = true }

[dev-dependencies]
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
auth = ["dep:bedrock_auth"]
protocol = [
    "dep:bedrock_network_protocol",
    "dep:bedrock_network_core",
    "dep:bedrock_network_macros",
]
network = ["dep:bedrock_network", "protocol", "auth"]
network-tokio = ["network", "bedrock_network/tokio"]
network-nethernet = ["network", "bedrock_network/nethernet"]
network-nethernet-tokio = ["network-nethernet", "network-tokio", "bedrock_network/nethernet-tokio"]
level = ["dep:bedrock_level"]
full = [
    "auth-ureq",
    "auth-reqwest",
    "protocol-all",
    "protocol-packet-dyn",
    "protocol-packet-meta",
    "protocol-packet-trace",
    "network-nethernet-tokio",
    "level",
    "form",
    "addon-std",
]
form = ["dep:bedrock_form"]
addon = ["dep:bedrock_addon"]
addon-std = ["addon", "dep:bedrock_addon_std"]

auth-ureq = ["auth", "bedrock_auth/ureq"]
auth-reqwest = ["auth", "bedrock_auth/reqwest"]

protocol-unknown = ["bedrock_network_protocol/unknown"]
protocol-v662 = ["bedrock_network_protocol/v662"]
protocol-v671 = ["bedrock_network_protocol/v671"]
protocol-v685 = ["bedrock_network_protocol/v685"]
protocol-v686 = ["bedrock_network_protocol/v686"]
protocol-v712 = ["bedrock_network_protocol/v712"]
protocol-v729 = ["bedrock_network_protocol/v729"]
protocol-v748 = ["bedrock_network_protocol/v748"]
protocol-v766 = ["bedrock_network_protocol/v766"]
protocol-v776 = ["bedrock_network_protocol/v776"]
protocol-v786 = ["bedrock_network_protocol/v786"]
protocol-v800 = ["bedrock_network_protocol/v800"]
protocol-v818 = ["bedrock_network_protocol/v818"]
protocol-v819 = ["bedrock_network_protocol/v819"]
protocol-v827 = ["bedrock_network_protocol/v827"]
protocol-v844 = ["bedrock_network_protocol/v844"]
protocol-v859 = ["bedrock_network_protocol/v859"]
protocol-v898 = ["bedrock_network_protocol/v898"]
protocol-v924 = ["bedrock_network_protocol/v924"]
protocol-v944 = ["bedrock_network_protocol/v944"]
protocol-v975 = ["bedrock_network_protocol/v975"]
protocol-v1001 = ["bedrock_network_protocol/v1001"]
protocol-v2168 = ["bedrock_network_protocol/v2168"]
protocol-v2168hotfix4 = ["bedrock_network_protocol/v2168hotfix4"]
protocol-v2169 = ["bedrock_network_protocol/v2169"]
protocol-v2193 = ["bedrock_network_protocol/v2193", "bedrock_network?/v2193"]
protocol-v2225 = ["bedrock_network_protocol/v2225"]
protocol-all = ["bedrock_network_protocol/all"]

protocol-packet-dyn = ["bedrock_network_protocol/packet-dyn"]
protocol-packet-meta = ["bedrock_network_protocol/packet-meta"]
protocol-packet-trace = ["bedrock_network_protocol/packet-trace"]

[[example]]
name = "server"
path = "examples/server.rs"
required-features = ["network-tokio", "protocol-v2225", "protocol-unknown"]

[[example]]
name = "client"
path = "examples/client.rs"
required-features = ["network-tokio", "protocol-v2225", "protocol-unknown"]
